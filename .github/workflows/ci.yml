# Everything a reader of this repository would want to know is true before a
# change lands: it compiles, the eleven behaviour tests hold, the doc example
# in the README actually runs, and the formatting is not a matter of opinion.
name: CI
on:
  push:
    branches: [main]
  pull_request:

# Merge-turn gate (ci:go). In 108-Plaza/thai-geography a PR runs this workflow's heavy jobs only when it
# carries the `ci:go` label (owner 2026-11-21 "ปรับการรัน ci เฉพาะ merge เข้า main พอ" ·
# "เพราะมันรันมากไป"). Without it each heavy job FAILS in seconds at "Wait for merge turn" (fail,
# never skip: a skipped required check counts as passing) and the run sits in its own
# pr-wait-<n> group, cancelled by the next push. A ci:go PR uses the shared `pr` group, never
# cancelled. Push to main keeps a per-sha group and is never cancelled. Any other repository
# (the yuthstyle88/*-dev mirror, whose authors cannot add labels) runs in full, as before.
# Merge turn: (1) add `ci:go` to ONE PR; (2) `gh pr update-branch` or close+reopen (a re-run does
# not see a label added later); (3) merge; (4) on FAIL remove `ci:go`.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || (github.event_name == 'pull_request' && github.repository == '108-Plaza/thai-geography' && !contains(github.event.pull_request.labels.*.name, 'ci:go') && format('pr-wait-{0}', github.event.pull_request.number) || 'pr') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.repository == '108-Plaza/thai-geography' && !contains(github.event.pull_request.labels.*.name, 'ci:go') }}

jobs:
  check:
    # hosted-ok: public repo — the org self-hosted runner group refuses public repos by default (fork-PR risk)
    runs-on: ubuntu-latest
    steps:
      - name: Wait for merge turn (ci:go)
        if: ${{ github.event_name == 'pull_request' && github.repository == '108-Plaza/thai-geography' && !contains(github.event.pull_request.labels.*.name, 'ci:go') }}
        run: |
          echo "::error::Not this PR's merge turn yet - add the ci:go label, then update-branch (or close+reopen) to run CI"
          exit 1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # `--all-targets` skips doctests, and the README's example is a doctest.
      - run: cargo test
