# Everything a reader of this repository would want to know is true before a
# change lands: it compiles, the eleven behaviour tests hold, the doc example
# in the README actually runs, and the formatting is not a matter of opinion.
name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Self-hosted. This repo is public and the org runner group refuses public
    # repos by default (fork-PR risk), so the job stays `queued` until the owner
    # allows this repo in the group: an owner decision, not a workflow edit.
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # `--all-targets` skips doctests, and the README's example is a doctest.
      - run: cargo test
